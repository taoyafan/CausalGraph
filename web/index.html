<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>CausalGraph · 因果图</title>
<style>
  :root {
    --bg: #f2f4f8; --card: #ffffff; --ink: #1f2733; --sub: #6b7684;
    --line: #e6e9f0; --accent: #3b6ef5; --accent-soft: #eaf0ff;
    --hi: #17a673; --mid: #e6961e; --lo: #e0524d; --op: #7b5bd6;
    --assume: #e08a1e;
    --shadow: 0 1px 3px rgba(20,30,60,.08), 0 6px 20px rgba(20,30,60,.05);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .app { max-width: 520px; margin: 0 auto; min-height: 100vh; background: var(--bg); }
  header {
    position: sticky; top: 0; z-index: 10; background: rgba(242,244,248,.9);
    backdrop-filter: saturate(180%) blur(10px);
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 10px; font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  header h1 small { color: var(--sub); font-weight: 500; font-size: 12px; margin-left: 6px; }
  .picker { display: flex; gap: 8px; }
  select {
    flex: 1; appearance: none; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    font-size: 14px; box-shadow: var(--shadow);
  }
  main { padding: 14px 16px 40px; }
  .summary {
    background: linear-gradient(135deg, #3b6ef5, #6a55e0); color: #fff;
    border-radius: 18px; padding: 18px 18px 16px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .summary .lbl { font-size: 13px; opacity: .9; }
  .summary .p50 { font-size: 34px; font-weight: 800; margin: 4px 0 2px; }
  .summary .p50 span { font-size: 15px; font-weight: 600; opacity: .85; margin-left: 4px; }
  .summary .range { font-size: 13px; opacity: .92; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 40px; margin-top: 12px; }
  .spark i { flex: 1; background: rgba(255,255,255,.55); border-radius: 2px 2px 0 0; min-height: 2px; }
  .spark i:hover { background: #fff; }
  .spark-axis { display: flex; justify-content: space-between; font-size: 11px; opacity: .85; margin-top: 4px; }
  .spark-axis span:nth-child(2) { opacity: .7; }
  .panel { margin-bottom: 16px; }
  .pstrip { display: flex; background: var(--card); border: 1px solid var(--line);
            border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .pseg { flex: 1; padding: 10px 12px; cursor: pointer; text-align: center;
          border-left: 1px solid var(--line); transition: background .1s; }
  .pseg:first-child { border-left: none; }
  .pseg:hover { background: var(--accent-soft); }
  .pseg.on { background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
  .pseg .pl { font-size: 11.5px; color: var(--sub); font-weight: 600; }
  .pseg .pv { font-size: 20px; font-weight: 800; margin-top: 3px; }
  .pseg .pv span { font-size: 12px; font-weight: 600; color: var(--sub); margin-left: 2px; }
  .sec-title { font-size: 12px; color: var(--sub); font-weight: 600; margin: 4px 2px 8px; letter-spacing: .5px; }
  .node { margin: 0 0 8px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; cursor: default; }
  .row.tap { cursor: pointer; }
  .cbar { width: 4px; align-self: stretch; border-radius: 4px; background: var(--mid); }
  .caret { width: 16px; text-align: center; color: var(--sub); transition: transform .15s; font-size: 12px; }
  .caret.open { transform: rotate(90deg); }
  .caret.leaf { visibility: hidden; }
  .title { flex: 1; min-width: 0; }
  .title b { display: block; font-weight: 600; font-size: 13.5px; }
  .title .meta { color: var(--sub); font-size: 11.5px; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .chip {
    font-size: 11px; padding: 2px 7px; border-radius: 999px; white-space: nowrap;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .chip.op { background: #f0ecff; color: var(--op); }
  .badge { font-size: 10.5px; padding: 1px 6px; border-radius: 6px; font-weight: 700; color: #fff; background: var(--assume); }
  .stat { text-align: right; }
  .stat b { font-size: 14px; }
  .stat small { display: block; color: var(--sub); font-size: 10.5px; }
  .pin { flex: none; border: 1px solid var(--line); background: #fff; color: var(--sub);
         font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 7px; cursor: pointer;
         white-space: nowrap; transition: background .1s, color .1s, border-color .1s; }
  .pin:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .detail { padding: 0 12px 12px 26px; font-size: 12.5px; color: var(--sub); }
  .detail .kv { margin: 2px 0; }
  .quote { background: #f7f8fb; border-left: 3px solid var(--line); border-radius: 8px;
           padding: 8px 10px; margin: 8px 0 4px; color: var(--ink); font-size: 12px; }
  .detail a { color: var(--accent); text-decoration: none; word-break: break-all; }
  .kids { margin-left: 14px; border-left: 2px solid var(--rail, var(--line)); padding-left: 12px; margin-top: 6px; }
  .kids > .node { position: relative; }
  .kids > .node::before {
    content: ""; position: absolute; left: -12px; top: 22px; width: 12px; height: 2px;
    background: var(--rail, var(--line)); border-radius: 2px;
  }
  .kids .card { box-shadow: 0 1px 2px rgba(20,30,60,.05); }
  .alert { color: var(--lo); font-weight: 600; }
  .loading, .err { text-align: center; color: var(--sub); padding: 40px 0; }
  .err { color: var(--lo); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>CausalGraph <small>因果推理图 · 可溯源</small></h1>
    <div class="picker">
      <select id="viewPicker"></select>
      <select id="nodePicker"></select>
    </div>
  </header>
  <main id="main"><div class="loading">加载中…</div></main>
</div>
<script src="export.js"></script>
<script>
const fmt = (v, d = 2) => (v === undefined || v === null) ? "—" : Number(v).toFixed(d);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };

function confColor(c) { return c >= 0.8 ? "var(--hi)" : c >= 0.4 ? "var(--mid)" : "var(--lo)"; }
function confLabel(c) { return c >= 0.8 ? "高" : c >= 0.4 ? "中" : "低"; }

// 数据节点证据类型角标: 短标签 + 区分色
const EVIDENCE_BADGE = {
  audited:          { text: "财报", color: "#17a673" },
  market_observed:  { text: "行情", color: "#0e7490" },
  analyst_estimate: { text: "预测", color: "#3b82c4" },
  assumption:       { text: "假设", color: "var(--assume)" },
};
// 层级导轨色: 三原色(红绿蓝)循环, 卡片左侧颜色条与所挂导轨同色
const RAIL = ["#2563eb", "#dc2626", "#16a34a"];
function railColor(depth) { return RAIL[depth % RAIL.length]; }

function spark(hist, unit) {
  const box = el("div", "spark");
  if (!hist) return box;
  const max = hist.max || 1;
  const edges = hist.edges || [];
  const total = hist.counts.reduce((a, b) => a + b, 0) || 1;
  const u = unit || "";
  hist.counts.forEach((c, i) => {
    const b = el("i");
    b.style.height = (6 + 34 * c / max) + "%";
    const lo = edges[i], hi = edges[i + 1];
    if (lo !== undefined && hi !== undefined) {
      const pct = (100 * c / total).toFixed(1);
      b.title = `${fmt(lo)} ~ ${fmt(hi)}${u} · ${c} 样本 (${pct}%)`;
    }
    box.appendChild(b);
  });
  return box;
}

// 直方图下方的坐标轴: 左端(最小) / 中位 / 右端(最大)
function sparkAxis(hist, unit) {
  const ax = el("div", "spark-axis");
  if (!hist || !hist.edges || hist.edges.length < 2) return ax;
  const e = hist.edges, u = unit || "";
  const lo = e[0], hi = e[e.length - 1], mid = (lo + hi) / 2;
  [lo, mid, hi].forEach((v, i) => {
    const s = el("span");
    s.textContent = fmt(v) + (i === 2 ? u : "");
    ax.appendChild(s);
  });
  return ax;
}

function summaryCard(root) {
  const c = el("div", "summary");
  const unit = root.display_unit || root.unit || "";
  c.innerHTML = `<div class="lbl">${root.label}</div>
    <div class="p50">${fmt(root.stats.p50)}<span>${unit}</span></div>
    <div class="range">区间 P10–P90: ${fmt(root.stats.p10)} ~ ${fmt(root.stats.p90)}${unit} · 均值 ${fmt(root.stats.mean)}${unit}</div>`;
  c.appendChild(spark(root.hist, unit));
  c.appendChild(sparkAxis(root.hist, unit));
  return c;
}

function nodeView(n, depth) {
  const wrap = el("div", "node");
  const card = el("div", "card");
  const row = el("div", "row" + (n.children && n.children.length ? " tap" : ""));

  const bar = el("div", "cbar");
  const caret = el("div", "caret" + (n.children && n.children.length ? "" : " leaf"));
  caret.textContent = "▶";
  const title = el("div", "title");
  const meta = el("div", "meta");
  bar.style.background = railColor(depth);  // 条色=本节点所在层级色(与左侧导轨同色)
  if (n.kind === "operator") {
    meta.innerHTML = `<span class="chip op">${n.operator_label || n.operator}</span>`;
  } else {
    meta.innerHTML = `<span class="chip">${n.dist || "data"}</span>`;
    const ev = EVIDENCE_BADGE[n.evidence_type] || { text: n.evidence_type_label || n.evidence_type, color: "#6b7684" };
    const badge = el("span", "badge");
    badge.style.background = ev.color;
    badge.textContent = ev.text;
    meta.appendChild(badge);
  }
  title.innerHTML = `<b>${n.label}</b>`;
  title.appendChild(meta);

  const stat = el("div", "stat");
  const unit = n.display_unit || n.unit || "";
  stat.innerHTML = `<b>${fmt(n.stats.p50)}${unit}</b><small>${fmt(n.stats.p10)}~${fmt(n.stats.p90)}${unit}</small>`;

  row.append(bar, caret, title, stat);
  // 置顶: 把该节点提为顶部主视图(等价于在下拉框选它), 免去从长列表里找。根节点(depth 0)本身已在顶部, 不加。
  if (depth >= 1 && n.id) {
    const pin = el("button", "pin");
    pin.type = "button";
    pin.textContent = "置顶";
    pin.title = "以此节点作为顶部主视图";
    pin.addEventListener("click", (e) => {
      e.stopPropagation();
      loadFocus(n.id);
    });
    row.appendChild(pin);
  }
  card.appendChild(row);

  const detail = el("div", "detail");
  detail.style.display = "none";
  if (n.alert) detail.innerHTML += `<div class="kv alert">⚠ ${n.alert}</div>`;
  if (n.kind === "data") {
    if (n.quote) detail.innerHTML += `<div class="quote">${n.quote}</div>`;
    const s = n.source || {};
    detail.innerHTML += `<div class="kv">来源: ${s.name || s.id || "—"}${s.publisher ? " · " + s.publisher : ""}</div>`;
    if (n.as_of) detail.innerHTML += `<div class="kv">数据时点: ${n.as_of}</div>`;
    if (s.url) detail.innerHTML += `<div class="kv"><a href="${s.url}" target="_blank" rel="noopener">原始出处 ↗</a></div>`;
  } else {
    detail.innerHTML += `<div class="kv">算子: ${n.operator_label || n.operator}</div>`;
  }
  card.appendChild(detail);
  wrap.appendChild(card);

  let kids = null;
  if (n.children && n.children.length) {
    kids = el("div", "kids");
    kids.style.setProperty("--rail", railColor(depth + 1));
    kids.style.display = "none";
    n.children.forEach(ch => kids.appendChild(nodeView(ch, depth + 1)));
    wrap.appendChild(kids);
    const toggle = () => {
      const open = kids.style.display === "none";
      kids.style.display = open ? "block" : "none";
      detail.style.display = open ? "block" : "none";
      caret.classList.toggle("open", open);
    };
    row.addEventListener("click", toggle);
    if (depth < 1) toggle(); // 顶层默认展开一层
  } else {
    row.classList.add("tap");
    row.addEventListener("click", () => {
      const open = detail.style.display === "none";
      detail.style.display = open ? "block" : "none";
    });
  }
  return wrap;
}

// 从扁平 DAG map 还原以 id 为根的贡献树: 每次展开克隆节点并按 inputs 递归挂 children。
// DAG 里被多父共享的上游会在不同路径下各展开一份(渲染需要), 但源数据只存一份。
function buildTree(g, id) {
  const flat = g[id];
  if (!flat) return null;
  const children = (flat.inputs || []).map(c => buildTree(g, c)).filter(Boolean);
  return Object.assign({}, flat, { children });
}

// 视图看板: 把 view.panel 的指标并成一条紧凑横条, 每格只显示中位数, 点格子钻取其贡献树。
function renderViewPanel(panel) {
  const g = window.CG_EXPORT.graph || {};
  const box = el("div", "panel");
  if (!panel || !panel.length) return box;
  const t = el("div", "sec-title"); t.textContent = "看板（点看溯源）";
  const strip = el("div", "pstrip");
  panel.forEach(m => {
    const node = g[m.id]; if (!node || !node.stats) return;
    const u = node.display_unit || m.unit || "";
    const seg = el("div", "pseg");
    seg.dataset.id = m.id;
    seg.innerHTML = `<div class="pl">${(m.label || "").split("(")[0].replace(/_/g, " ")}</div>
      <div class="pv">${fmt(node.stats.p50)}<span>${u}</span></div>`;
    seg.addEventListener("click", () => loadFocus(m.id));
    strip.appendChild(seg);
  });
  box.append(t, strip);
  return box;
}

// 选定视图: 顶部看板(panel, 无则退化为锚点单格) + 下方锚点贡献树钻取。
function showView(view) {
  const main = document.getElementById("main");
  main.innerHTML = "";
  const panel = (view.panel && view.panel.length)
    ? view.panel
    : [{ id: view.anchor, label: view.anchor_label, unit: view.anchor_unit }];
  fillNodePicker(view.anchor, collectMembers(view.anchor, view.panel));
  main.appendChild(renderViewPanel(panel));
  const detail = el("div"); detail.id = "detail";
  main.appendChild(detail);
  loadFocus(view.anchor);
}

async function loadFocus(node) {
  const host = document.getElementById("detail") || document.getElementById("main");
  host.innerHTML = `<div class="loading">求值中…</div>`;
  try {
    const g = window.CG_EXPORT && window.CG_EXPORT.graph;
    if (!g || !g[node]) { host.innerHTML = `<div class="err">无此节点的导出数据: ${node}</div>`; return; }
    const tree = buildTree(g, node);
    host.innerHTML = "";
    host.appendChild(summaryCard(tree));
    const t = el("div", "sec-title"); t.textContent = "贡献分解（点卡片展开溯源）";
    host.appendChild(t);
    host.appendChild(nodeView(tree, 0));
    document.querySelectorAll(".pseg").forEach(c => c.classList.toggle("on", c.dataset.id === node));
    const np = document.getElementById("nodePicker");
    if (np && [...np.options].some(o => o.value === node)) np.value = node;
  } catch (e) {
    host.innerHTML = `<div class="err">加载失败: ${e}</div>`;
  }
}

// 从锚点(及 panel)沿 inputs 递归收集全部上游成员 id(去重), 供第二级"任意节点"下拉列出。
function collectMembers(anchor, panel) {
  const g = window.CG_EXPORT.graph || {};
  const seen = new Set(), stack = [anchor, ...((panel || []).map(p => p.id))];
  while (stack.length) {
    const id = stack.pop();
    if (!id || seen.has(id) || !g[id]) continue;
    seen.add(id);
    (g[id].inputs || []).forEach(c => stack.push(c));
  }
  return [...seen];
}

// 填第二级下拉: 锚点(★)置顶, 其余算子(·)在前、数据源在后, 各按标签排序。
function fillNodePicker(anchor, memberIds) {
  const np = document.getElementById("nodePicker");
  const g = window.CG_EXPORT.graph || {};
  np.innerHTML = "";
  const rest = memberIds.filter(id => id !== anchor && g[id]);
  rest.sort((a, b) => {
    const ka = g[a].kind === "operator" ? 0 : 1, kb = g[b].kind === "operator" ? 0 : 1;
    if (ka !== kb) return ka - kb;
    const la = g[a].label || a, lb = g[b].label || b;
    return la < lb ? -1 : la > lb ? 1 : 0;
  });
  const ordered = anchor && g[anchor] ? [anchor, ...rest] : rest;
  ordered.forEach(id => {
    const n = g[id]; if (!n) return;
    const mark = id === anchor ? "★ " : (n.kind === "operator" ? "· " : "◦ ");
    const o = el("option"); o.value = id; o.textContent = mark + (n.label || id);
    np.appendChild(o);
  });
}

let VIEWS = null;       // window.CG_EXPORT.views: {categories}（诊断桶 orphans 仅 CLI outline 暴露）
let VIEW_INDEX = [];    // 下拉 option value(序号) -> 视图对象

// 用『分类(optgroup) → 视图』填充下拉; 末尾附诊断桶入口。
function buildViewPicker() {
  const vp = document.getElementById("viewPicker");
  vp.innerHTML = ""; VIEW_INDEX = [];
  VIEWS.categories.forEach(cat => {
    const og = el("optgroup"); og.label = cat.name;
    cat.views.forEach(v => {
      const o = el("option"); o.value = String(VIEW_INDEX.length); o.textContent = v.name;
      VIEW_INDEX.push(v); og.appendChild(o);
    });
    vp.appendChild(og);
  });
}

function onPick(val) {
  const v = VIEW_INDEX[Number(val)];
  if (v) showView(v);
}

async function init() {
  const vp = document.getElementById("viewPicker");
  const np = document.getElementById("nodePicker");
  try {
    VIEWS = (window.CG_EXPORT && window.CG_EXPORT.views) || null;
    if (!VIEWS || !VIEWS.categories || !VIEWS.categories.length) {
      document.getElementById("main").innerHTML = `<div class="err">未找到视图数据 export.js，请先运行 python -m cgraph.cli export</div>`;
      return;
    }
    buildViewPicker();
    vp.addEventListener("change", () => onPick(vp.value));
    np.addEventListener("change", () => loadFocus(np.value));
    onPick(vp.value);
  } catch (e) {
    document.getElementById("main").innerHTML = `<div class="err">加载失败: ${e}</div>`;
  }
}
init();
</script>
</body>
</html>
